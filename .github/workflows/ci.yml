name: bootstrap-author-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Parser and non-installing unit tests
        shell: ${{ matrix.shell }}
        run: ./tests/run.ps1
      - name: Package source candidate (not a release)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          git archive --format=zip --output=artifacts/bootstrap-candidate.zip HEAD
          $hash = (Get-FileHash artifacts/bootstrap-candidate.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  bootstrap-candidate.zip" | Set-Content artifacts/SHA256SUMS.txt
          @{ commit=(git rev-parse HEAD); tree=(git rev-parse HEAD^{tree}); scope='author mock/parser checks only'; cleanWindowsInstall='NOT_RUN'; iva='NOT_RUN' } | ConvertTo-Json | Set-Content artifacts/evidence.json
      - uses: actions/upload-artifact@v4
        if: matrix.shell == 'pwsh'
        with:
          name: bootstrap-candidate
          path: artifacts/
          retention-days: 14
